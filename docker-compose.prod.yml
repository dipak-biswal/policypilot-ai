services:
  db:
    ports: !reset []
  backend:
    ports: !reset []
  frontend:
    build:
      args:
        VITE_API_URL: /api
    ports: !reset []
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
volumes:
  caddy_data:
  caddy_config:
