services:
  db:
    image: pgvector/pgvector:pg16
    container_name: policypilot-db
    environment:
      POSTGRES_USER: policypilot
      POSTGRES_PASSWORD: policypilot
      POSTGRES_DB: policypilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U policypilot"]
      interval: 5s
      retries: 5

volumes:
  pgdata:
