[project]
name = "PolicyPilot-AI"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dipak Biswal", email = "dk.biswal92@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.160.0",
    "langchain-chroma>=1.1.0",
    "langchain-openai>=1.7.2",
    "langchain-postgres>=0.0.19",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.16",
    "psycopg[binary]>=3.3.6",
    "pypdf>=6.21.2",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "slowapi>=0.1.10",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "langchain-community<0.4.2",
    "pytest>=9.1.1",
    "ragas>=0.4.3",
]
